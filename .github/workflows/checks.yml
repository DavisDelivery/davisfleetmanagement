name: checks

on:
  # Only main on push. Every other branch is covered by the pull_request trigger, and
  # listening to both would run the whole suite twice for each commit on a PR.
  push:
    branches: [main]
  pull_request:

jobs:
  # The gate that matters most: a syntax error is a white screen for every driver and
  # mechanic at once. Netlify runs the same build, so if this passes the deploy will
  # produce the same bundles the yard gets.
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: App.jsx and boot.jsx parse
        run: npm run check
      - name: the production build succeeds
        run: npm run build

  # Money logic. These run the real functions out of App.jsx — no browser needed.
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: .uitest
      - name: cost shard merge (server imports must survive a browser write)
        run: node cost-merge.mjs
        working-directory: .uitest
      - name: repairCostLedger fixtures
        run: node ledger.mjs
        working-directory: .uitest
      - name: prefixed unit numbers resolve to real fleet trucks
        run: node truck-id.mjs
        working-directory: .uitest
      - name: a repair invoice lands whole on one truck
        run: node repair-whole.mjs
        working-directory: .uitest
      - name: completion timestamps keep their time
        run: node repair-time.mjs
        working-directory: .uitest
      - name: invoice ids are unique, so the ledger never drops a row
        run: node entry-ids.mjs
        working-directory: .uitest
      - name: a whole delivery never stays booked to one truck
        run: node fuel-plausibility.mjs
        working-directory: .uitest
      - name: stored invoices are served as PDFs, not octet-stream
        run: node invoice-file-meta.mjs
        working-directory: .uitest
      - name: a repair shop's own formatting imports as money, not zero
        run: node complete-fleet.mjs
        working-directory: .uitest

  # Both entry points actually boot. puppeteer's postinstall fetches its own Chrome,
  # which .uitest/browser.mjs falls back to when CHROME_PATH is unset.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: .uitest
      - name: shop portal boots
        run: node portal-syntax.mjs
        working-directory: .uitest
      - name: the portal inside Settings reads live data and never writes it
        run: node mechanic-test-mode.mjs
        working-directory: .uitest
      - name: cold start ships no compiler and stays under budget
        run: node coldstart.mjs
        working-directory: .uitest
      - name: a stalled database gives a retry, not an endless spinner
        run: node load-timeout.mjs
        working-directory: .uitest
      - name: one slow document does not stop the app, or seed a demo roster over a real fleet
        run: node cold-start-partial.mjs
        working-directory: .uitest
      - name: opening the app costs a bounded number of reads, however much history there is
        run: node startup-fanout.mjs
        working-directory: .uitest
      - name: coming back from the background does not leave a dead connection
        run: node resume-reset.mjs
        working-directory: .uitest
      - name: a week that failed to load is never written back over the real one
        run: node week-write-guard.mjs
        working-directory: .uitest
      - name: fleet app boots and storage.list is correct
        run: node app-boot.mjs
        working-directory: .uitest
      - name: dashboard carries both halves of the merged screen
        run: node dashboard-merge.mjs
        working-directory: .uitest
      - name: upload boxes accept a dragged file
        run: node dropzone.mjs
        working-directory: .uitest
      - name: classic stays the default and New renders
        run: node view-toggle.mjs
        working-directory: .uitest
      - name: weekly board rows are a uniform height
        run: node board-row-height.mjs
        working-directory: .uitest
      - name: quick-add a missing roster truck clears its queue items
        run: node review-queue-quickadd.mjs
        working-directory: .uitest
      - name: reassigning a missing truck to an existing one fixes typos, not just gaps
        run: node review-queue-reassign.mjs
        working-directory: .uitest
      - name: Fleet List models are dropdowns and Deleted is a column, and looking changes nothing
        run: node fleet-list.mjs
        working-directory: .uitest

  # The invoice import pipeline, stubbed end to end.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: .synctest
      - name: sync harness
        run: node harness.mjs
        working-directory: .synctest
      - name: sync stages
        run: node stages.mjs
        working-directory: .synctest
      - name: built-in vendors reach an install that already saved a list
        run: node vendor-merge.mjs
        working-directory: .synctest
