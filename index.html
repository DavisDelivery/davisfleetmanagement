<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Davis Fleet Management</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e5b92">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e5b92'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>F</text></svg>">
<!-- The Firestore TLS handshake used to start only after 515 KB of CDN script had
     downloaded and run. These let it overlap. Firestore's own requests are credentialed
     (supportsCrossDomainXhr with withCredentials, which the fetch shim maps to
     credentials:include), and an anonymous preconnect is not guaranteed to be reused by
     a credentialed request — hence use-credentials here and a bare hint for gstatic,
     whose script loads are no-cors. Unmeasured: a hint that fails to match is wasted,
     not harmful. -->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin="use-credentials">
<link rel="preconnect" href="https://www.gstatic.com">
<style>
  body { margin: 0; font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif; background: #f5f7fa; }
  #loading { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 12px; color: #6b7785; font-size: 14px; }
  #loading .spin { width: 36px; height: 36px; border: 3px solid #dde3ea; border-top: 3px solid #1e5b92; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"><div id="loading"><div class="spin"></div>Loading Fleet Management...</div></div>
<!-- These four were in <head> with no defer, so the browser could not paint the
     spinner below until all 515 KB of them had downloaded AND executed — on the phone
     that is the blank screen before anything appears. Moved after #root so the first
     paint happens immediately; execution order is unchanged, and the inline config
     script below still runs after firebase is defined.
     React is pinned: "react@18" is a redirect on unpkg (measured, one extra
     round trip each), and an unpinned major can change under the app without warning. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCaaHZ0GuBoxl696-PzlgBQLPEad1xyiqw",
  authDomain: "davisfleetmanagement.firebaseapp.com",
  projectId: "davisfleetmanagement",
  storageBucket: "davisfleetmanagement.firebasestorage.app",
  messagingSenderId: "397276214754",
  appId: "1:397276214754:web:aa7bd4723c301fb876b5bb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// v2.28.0 — transport hardening. Read the caveats: this is the least-evidenced change
// in this file, and an independent review corrected several claims that stood here.
//
// SETTLED, and reproduced against the real bundle with the backend shaped in puppeteer:
//   handshake held open       -> all reads reject at 10.0s, "client is offline"
//   handshake aborted         -> all reads reject at  0.03s, same message
//   handshake OK, then silent -> all reads hang; the app's ceiling calls it a timeout
// Only the third matches the screen the owner photographed. Once the handshake POST is
// answered the client marks itself Online and CANCELS its 10s "Backend didn't respond"
// timer, after which a get() settles only on a snapshot or on a transition to Offline —
// and a connected-but-silent stream never transitions. Measured: a get() on such a
// stream was still unsettled after 300 seconds. All reads share one Listen stream, so
// they fail together, on one clock. That much is not in doubt.
//
// NOT SETTLED: what silences the stream on the phone. This setting is a guess at it.
//
// What IS verified about the setting, in the bytes this page loads (4.6.2):
//   oc=!0 ... Object.assign({useFetchStreams:oc}, settings)   -> the default is TRUE
//   this.useFetchStreams && (o.xmlHttpFactory = new fn({}))   -> installs a fetch shim
//   fn: fetch(new Request(...)) ... e.body.getReader()        -> streamed response body
// and Chromium reports every Listen request as resourceType "fetch". Turning it off
// leaves both factory slots unset, so closure falls through to native XMLHttpRequest.
//
// Corrections to what was written here before, all of them verified against the tagged
// @firebase/firestore sources rather than inferred from changelog titles:
//   - useFetchStreams has defaulted to TRUE in register.ts at EVERY version from 4.3.1
//     through 4.9.2. It was never "disabled and re-enabled"; that history was wrong.
//     What #7729 and #8197 flipped is webchannel_connection.ts, and BOTH sides of that
//     flip are fetch() — "xmlhttprequest" there means closure's XhrIo abstraction over
//     FetchXmlHttp, not native XHR. 4.6.2 is already the rolled-back state.
//   - So this line does not restore a configuration Firebase ever shipped. It selects a
//     third one (native XHR). That may still be worth having, since it is the only
//     setting that leaves the fetch/ReadableStream path entirely — but it is a guess,
//     not a return to a known-good default.
//   - "WebKit buffers streamed fetch bodies" was asserted here with no source and is
//     removed. It also argues against itself: experimentalAutoDetectLongPolling is on
//     by default and its whole job is to spot a buffering path and drop to long
//     polling. A transport that buffered would degrade, not hang.
// merge:true keeps auto-detect and every other default in place.
//
// The changes that actually make the app survive this are in App.jsx, not here: reset
// the connection on timeout and on resume, and never let a failed read masquerade as
// empty data. If this line turns out to do nothing, those still hold.
try { if (typeof db.settings === "function") db.settings({ useFetchStreams: false, merge: true }); }
catch (e) { console.warn("Firestore settings() rejected; continuing on defaults:", e && e.message); }
window.db = db; // expose for real-time onSnapshot listeners in App.jsx
window.storage = {
  async get(key) { try { const doc = await db.collection("kv").doc(key).get(); if (!doc.exists) throw new Error("not found"); return { key, value: doc.data().v }; } catch (e) { window.__lastStorageError = e.message || String(e); throw e; } },
  async set(key, value) { try { const bytes = (typeof TextEncoder !== "undefined") ? new TextEncoder().encode(value).length : value.length; if (bytes > 1048000) { const msg = "Firestore 1 MB document limit exceeded for key=" + key + " (" + bytes + " bytes). Not saved."; console.error(msg); window.__lastStorageError = msg; return null; } await db.collection("kv").doc(key).set({ v: value, ts: new Date().toISOString() }); return { key, value }; } catch (e) { console.error("storage.set failed for key=", key, "error=", e); window.__lastStorageError = e.message || String(e); return null; } },
  async delete(key) { try { await db.collection("kv").doc(key).delete(); return { key, deleted: true }; } catch (e) { return null; } },
  // A prefix list used to download EVERY document in the collection and filter client
  // side — three full scans before first paint, growing with every week of history.
  // A documentId() range query reads only the matching span. The documents arrive with
  // that query anyway, so return their values too and let callers skip re-fetching each
  // key one at a time. An empty prefix still means "everything" (the admin dump).
  async list(prefix) { try { let q = db.collection("kv"); if (prefix) { const end = prefix.slice(0, -1) + String.fromCharCode(prefix.charCodeAt(prefix.length - 1) + 1); q = q.where(firebase.firestore.FieldPath.documentId(), ">=", prefix).where(firebase.firestore.FieldPath.documentId(), "<", end); } const snap = await q.get(); const keys = []; const values = {}; snap.forEach(doc => { keys.push(doc.id); const d = doc.data(); if (d && d.v !== undefined) values[doc.id] = d.v; }); return { keys, values }; } catch (e) { console.error("storage.list failed:", e); window.__lastStorageError = e.message || String(e); return { keys: [], error: e.message || String(e) }; } }
};
</script>
<!-- No compiler reaches the phone any more. App.jsx and boot.jsx are transpiled at
     build time by build.mjs; @babel/standalone used to be downloaded and run here,
     which cost 604 KB gzipped (2.87 MB unpacked — more than everything else on this
     page combined) plus a full compile of 609 KB of source on the device before the
     first pixel. Measured on a 4x-throttled CPU with an empty cache: 12,410 ms then,
     683 ms now (.uitest/coldstart-bench.mjs). Keep these as plain scripts — the
     moment one becomes type="text/babel" again, the compiler comes back with it. -->
<script>
const { useState, useEffect, useCallback, useMemo, useRef } = React;
</script>
<script src="app.build.js"></script>
<script src="boot.build.js"></script>
</body>
</html>
