<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Davis Fleet Management</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e5b92">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e5b92'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>F</text></svg>">
<style>
  body { margin: 0; font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif; background: #f5f7fa; }
  #loading { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 12px; color: #6b7785; font-size: 14px; }
  #loading .spin { width: 36px; height: 36px; border: 3px solid #dde3ea; border-top: 3px solid #1e5b92; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="loading"><div class="spin"></div>Loading Fleet Management...</div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCaaHZ0GuBoxl696-PzlgBQLPEad1xyiqw",
  authDomain: "davisfleetmanagement.firebaseapp.com",
  projectId: "davisfleetmanagement",
  storageBucket: "davisfleetmanagement.firebasestorage.app",
  messagingSenderId: "397276214754",
  appId: "1:397276214754:web:aa7bd4723c301fb876b5bb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
window.db = db; // expose for real-time onSnapshot listeners in App.jsx
window.storage = {
  async get(key) { try { const doc = await db.collection("kv").doc(key).get(); if (!doc.exists) throw new Error("not found"); return { key, value: doc.data().v }; } catch (e) { window.__lastStorageError = e.message || String(e); throw e; } },
  async set(key, value) { try { const bytes = (typeof TextEncoder !== "undefined") ? new TextEncoder().encode(value).length : value.length; if (bytes > 1048000) { const msg = "Firestore 1 MB document limit exceeded for key=" + key + " (" + bytes + " bytes). Not saved."; console.error(msg); window.__lastStorageError = msg; return null; } await db.collection("kv").doc(key).set({ v: value, ts: new Date().toISOString() }); return { key, value }; } catch (e) { console.error("storage.set failed for key=", key, "error=", e); window.__lastStorageError = e.message || String(e); return null; } },
  async delete(key) { try { await db.collection("kv").doc(key).delete(); return { key, deleted: true }; } catch (e) { return null; } },
  // A prefix list used to download EVERY document in the collection and filter client
  // side — three full scans before first paint, growing with every week of history.
  // A documentId() range query reads only the matching span. The documents arrive with
  // that query anyway, so return their values too and let callers skip re-fetching each
  // key one at a time. An empty prefix still means "everything" (the admin dump).
  async list(prefix) { try { let q = db.collection("kv"); if (prefix) { const end = prefix.slice(0, -1) + String.fromCharCode(prefix.charCodeAt(prefix.length - 1) + 1); q = q.where(firebase.firestore.FieldPath.documentId(), ">=", prefix).where(firebase.firestore.FieldPath.documentId(), "<", end); } const snap = await q.get(); const keys = []; const values = {}; snap.forEach(doc => { keys.push(doc.id); const d = doc.data(); if (d && d.v !== undefined) values[doc.id] = d.v; }); return { keys, values }; } catch (e) { console.error("storage.list failed:", e); window.__lastStorageError = e.message || String(e); return { keys: [], error: e.message || String(e) }; } }
};
</script>
<!-- data-presets is not cosmetic. With no presets attribute Babel defaults to
     ["react","env"] plus three plugins plus inline source maps. On this file that is
     14.6s of blocked main thread producing 2.3MB of output, against 0.8s and 485KB
     for the one preset we actually need — 18.7x, measured in Chromium by
     .uitest/transpile-bench.mjs (re-run it if you doubt the number). A phone's CPU is
     several times slower again, and none of it is cacheable.
     App.jsx uses optional chaining but no ??, class fields or private fields, so
     dropping `env` costs us nothing above Chrome 80 / Safari 13.4 (2020). -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
</script>
<script type="text/babel" data-presets="react" src="App.jsx"></script>
<script type="text/babel" data-presets="react">
// A throw anywhere inside App() used to leave the loading spinner up forever and take
// DVIRs, the repair board and the cost ledger down together, on phones with no console.
// Contain it and give the person on the yard something to act on.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error("Fleet app crashed:", err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ padding: "28px 20px", maxWidth: 520, margin: "0 auto", fontFamily: "'Segoe UI', system-ui, sans-serif", color: "#243447" }}>
        <h1 style={{ fontSize: 20, margin: "0 0 10px" }}>The app hit an error and stopped</h1>
        <p style={{ fontSize: 15, lineHeight: 1.5, color: "#5b6b7a", margin: "0 0 18px" }}>
          Your saved work is not affected — this screen failed to draw. Reloading usually clears it.
          If it keeps happening, send this message to the office.
        </p>
        <button onClick={() => location.reload()} style={{ background: "#1e5b92", color: "#fff", border: 0, borderRadius: 6, padding: "12px 20px", fontSize: 16, fontWeight: 600, minHeight: 44 }}>
          Reload
        </button>
        <pre style={{ marginTop: 20, padding: 12, background: "#f1f4f7", border: "1px solid #dde3ea", borderRadius: 6, fontSize: 12, whiteSpace: "pre-wrap", wordBreak: "break-word", color: "#6b7785" }}>
          {String(this.state.err && (this.state.err.stack || this.state.err.message) || this.state.err)}
        </pre>
      </div>
    );
  }
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(ErrorBoundary, null, React.createElement(App)));
</script>
</body>
</html>
