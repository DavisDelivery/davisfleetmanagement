[build]
  publish = "."
  # There used to be nothing between `git push` and the yard: a single bad character
  # in App.jsx shipped a white screen to every driver and mechanic at once. esbuild
  # parses the file and fails the deploy instead — and now also transpiles it, so the
  # phone no longer downloads a 604 KB compiler and runs it before first paint.
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# App.jsx was served as application/octet-stream, which Netlify does not compress —
# 526 KB over the wire on every load, on phones in a yard. Declaring the real type
# makes it compressible and is what the browser should have been told anyway.
[[headers]]
  for = "/App.jsx"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# The built bundles are regenerated by every deploy and carry no user data. They are
# revalidated like the rest of the site, so a deploy is picked up without a hard
# refresh — the yard has been served a stale App.jsx before.
[[headers]]
  for = "/app.build.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/boot.build.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
